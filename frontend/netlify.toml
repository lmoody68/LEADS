# L.E.A.D.S. — neutral public front (leads-deepsearch.netlify.app).
# The API is proxied server-side to the backend; the backend host never appears
# in the browser address bar or in any advertised link.
[build]
  publish = "dist"

# API proxy — MUST come before the SPA catch-all (first match wins).
[[redirects]]
  from = "/api/*"
  to = "https://leads.mac-vision.com/api/:splat"
  status = 200
  force = true

# SPA fallback — every other path serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
